# CI Vale config — same gate as .vale.ini minus the official ASD dictionary.
# DictionaryFull is generated locally from the licensed PDF and never committed
# (copyright); CI enforces Slop + STE writing rules only. Local runs use
# .vale.ini via `pnpm prose` (adds DictionaryFull).

StylesPath = styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/latest/download/vale-llm-slop.zip

[*.md]
BasedOnStyles = Slop, STE, Repo
STE.Dictionary = NO
STE.Ambiguity = NO

[*.{ts,tsx,js,jsx,mjs,cjs}]
BasedOnStyles = Slop

[scripts/**]
BasedOnStyles = ""

[styles/**]
BasedOnStyles = ""

[.agents/skills/**]
BasedOnStyles = ""

[.opencode/**]
BasedOnStyles = ""

[docs/code/**]
BasedOnStyles = ""

[docs/agents/**]
BasedOnStyles = ""

[.github/**]
BasedOnStyles = ""
