# Local STE Ambiguity override.
#
# The package STE.Ambiguity bans slash-separated pairs ("a slash standing in
# for and/or"). That rule is wrong for software docs: repo paths (apps/web),
# package names (motion/react), and intentional pair lists (top/bottom) are
# technical names, exempt under ASD-STE100 Rule 2.2. This copy keeps the
# genuine ambiguity checks (and/or, e.g., etc., i.e.) and drops the slash token.
extends: existence
message: "STE: '%s' is ambiguous. Write the alternatives out in full."
link: https://github.com/Syntaf/vale-llm-slop#steambiguity
level: error
ignorecase: true
nonword: true
tokens:
  - '\band\s*/\s*or\b'
  - '\betc\.?'
  - '\be\.g\.'
  - '\bi\.e\.'
  - '\band\s+so\s+(?:on|forth)\b'
  - '\bas\s+(?:required|necessary|applicable)\b'
  - '\bif\s+(?:required|necessary|applicable)\b'
