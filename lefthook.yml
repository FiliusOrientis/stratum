pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,css,html,yml,yaml}"
      run: pnpm lint
    collocated:
      run: pnpm check-collocated

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test:coverage
    audit:
      run: pnpm audit:all && pnpm audit --audit-level=high

post-merge:
  commands:
    docs-gate:
      run: pnpm docs-gate
    prose:
      run: pnpm prose

post-checkout:
  commands:
    hint:
      run: node scripts/pipeline-hint.mjs
      skip:
        - merge
        - rebase
