# Vale prose linting configuration — ASD-STE100 (official dictionary) +
# STE100 writing rules + Slop (LLM-tell prose). See AGENTS.md / pipelines.md
# "Documentation" pipeline. Run: pnpm prose

StylesPath = styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/latest/download/vale-llm-slop.zip

# Markdown docs get the full stack: STE100 writing rules + official
# dictionary + LLM-tell detection. STE.Dictionary (the package's plain-English
# list) is superseded by DictionaryFull (the official ASD dictionary).
[*.md]
BasedOnStyles = Slop, STE, Repo, DictionaryFull
STE.Dictionary = NO
STE.Ambiguity = NO

# Code comments (ts/tsx) get LLM-tell detection only — full STE in code
# comments is too strict for identifiers and inline notes.
[*.{ts,tsx,js,jsx,mjs,cjs}]
BasedOnStyles = Slop

# Scripts, generated files, vendored code, and the dictionary itself.
[scripts/**]
BasedOnStyles = ""

[styles/**]
BasedOnStyles = ""

[.agents/skills/**]
BasedOnStyles = ""

[.opencode/**]
BasedOnStyles = ""

# Generated per-module API docs and agent instruction docs — reference
# material, not authored prose (same exclusion as skills).
[docs/code/**]
BasedOnStyles = ""

[docs/agents/**]
BasedOnStyles = ""

[.github/**]
BasedOnStyles = ""




